name: Fetch SPIRV-Cross Natives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Official branch
        uses: actions/checkout@v4
        with:
          ref: Official
          fetch-depth: 1

      - name: Remove old LFS tracking
        run: |
          if [ -f .gitattributes ]; then
            sed -i '/spirv-cross-natives\.aar/d' .gitattributes
            if [ ! -s .gitattributes ]; then
              rm .gitattributes
            fi
          fi

      - name: Fetch SPIRV-Cross natives AAR
        run: |
          mkdir -p ZalithLauncher/libs

          curl -fL --retry 5 --retry-delay 5 \
            -o ZalithLauncher/libs/spirv-cross-natives.aar \
            "https://raw.githubusercontent.com/AngelAuraMC/Amethyst-Android/v3_openjdk/app_pojavlauncher/libs/spirv-cross-natives.aar"

      - name: Verify AAR
        run: |
          test -s ZalithLauncher/libs/spirv-cross-natives.aar
          ls -lh ZalithLauncher/libs/spirv-cross-natives.aar

          FILE_SIZE=$(stat -c%s ZalithLauncher/libs/spirv-cross-natives.aar)
          MAX_SIZE=104857600

          if [ "$FILE_SIZE" -ge "$MAX_SIZE" ]; then
            echo "ERROR: AAR is larger than GitHub's 100 MB file limit."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A .gitattributes ZalithLauncher/libs/spirv-cross-natives.aar

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add SPIRV-Cross natives AAR"
          git push origin HEAD:Official
