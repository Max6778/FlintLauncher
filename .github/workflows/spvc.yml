name: Fetch SPIRV-Cross Natives

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Official branch
        uses: actions/checkout@v4
        with:
          ref: Official
          fetch-depth: 1

      - name: Fetch SPIRV-Cross natives AAR
        run: |
          mkdir -p app_pojavlauncher/libs

          curl -fL \
            -o app_pojavlauncher/libs/spirv-cross-natives.aar \
            "https://raw.githubusercontent.com/AngelAuraMC/Amethyst-Android/v3_openjdk/app_pojavlauncher/libs/spirv-cross-natives.aar"

      - name: Verify downloaded AAR
        run: |
          test -s app_pojavlauncher/libs/spirv-cross-natives.aar
          ls -lh app_pojavlauncher/libs/spirv-cross-natives.aar
