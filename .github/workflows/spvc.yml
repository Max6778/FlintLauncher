name: Fetch SPIRV-Cross Natives

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Official branch
        uses: actions/checkout@v4
        with:
          ref: Official
          fetch-depth: 1
          lfs: true

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Track SPIRV-Cross AAR with Git LFS
        run: |
          git lfs track "ZalithLauncher/libs/spirv-cross-natives.aar"
          git add .gitattributes

      - name: Fetch SPIRV-Cross natives AAR
        run: |
          mkdir -p ZalithLauncher/libs

          curl -fL --retry 5 --retry-delay 5 \
            -o ZalithLauncher/libs/spirv-cross-natives.aar \
            "https://raw.githubusercontent.com/AngelAuraMC/Amethyst-Android/v3_openjdk/app_pojavlauncher/libs/spirv-cross-natives.aar"

      - name: Verify AAR
        run: |
          test -s ZalithLauncher/libs/spirv-cross-natives.aar
          ls -lh ZalithLauncher/libs/spirv-cross-natives.aar

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ZalithLauncher/libs/spirv-cross-natives.aar

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Add SPIRV-Cross natives AAR"

      - name: Push
        run: |
          git push origin HEAD:Official
