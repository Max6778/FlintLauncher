name: Fetch SDL3 Android Natives

# Grabs the OFFICIAL prebuilt SDL3 Android package straight from
# libsdl-org/SDL releases (SDL3-devel-X.Y.Z-android.zip). No NDK,
# no compiling — SDL publishes precompiled libSDL3.so for every ABI
# plus the org.libsdl.app Java sources, ready to drop in.
#
# What to do:
#   1. Copy this file to: .github/workflows/fetch-sdl3-natives.yml
#      (via GitHub's web "Add file" button).
#   2. Commit it to a branch, then go to Actions ->
#      "Fetch SDL3 Android Natives" -> Run workflow.
#   3. Download the "sdl3-android-package" artifact when it finishes.
#      It'll contain the exact folder layout from the zip so we can
#      see what's inside and pick out jniLibs + java sources for the
#      next step (writing the bridge that plugs into MinecraftGLSurface).

on:
  workflow_dispatch:
    inputs:
      sdl_version:
        description: "SDL3 version to fetch (see github.com/libsdl-org/SDL/releases)"
        required: true
        default: "3.4.12"

jobs:
  fetch-sdl3:
    runs-on: ubuntu-latest
    steps:
      - name: Download official SDL3 Android devel package
        run: |
          VER="${{ github.event.inputs.sdl_version }}"
          URL="https://github.com/libsdl-org/SDL/releases/download/release-${VER}/SDL3-devel-${VER}-android.zip"
          echo "Fetching $URL"
          curl -L -o sdl3-android.zip "$URL"

      - name: Extract and inspect layout
        run: |
          mkdir -p sdl3-android-package
          unzip -q sdl3-android.zip -d sdl3-android-package
          echo "----- Full contents -----"
          find sdl3-android-package -maxdepth 6 | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-android-package
          path: sdl3-android-package/

