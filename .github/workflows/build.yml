name: Build FlintLauncher APK

on:
  push:
    branches: [ Official, master, dev ]
  pull_request:
    branches: [ Official, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "y" | sdkmanager "cmake;3.22.1"

      - name: Grant Gradle Execute Permission
        run: chmod +x gradlew

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Build LWJGL 3.3.3 / 3.4.1 components
        run: ./gradlew :jre_lwjgl3glfw:clean :jre_lwjgl3glfw_341:clean :jre_lwjgl3glfw:jar :jre_lwjgl3glfw_341:jar --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleProguardNoDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlintLauncher-debug-${{ github.run_number }}
          path: ZalithLauncher/build/outputs/apk/debug/*.apk
          retention-days: 30
