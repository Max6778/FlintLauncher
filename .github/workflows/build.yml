name: Build FlintLauncher APK

on:
  push:
    branches: [ Official, master, dev ]
  pull_request:
    branches: [ Official, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: flintlauncher-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;25.2.9519653"
          yes | sdkmanager "cmake;3.22.1"

      - name: Grant Gradle Execute Permission
        run: chmod +x gradlew

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Build LWJGL 3.3.3 / 3.4.1 components
        run: ./gradlew :jre_lwjgl3glfw:clean :jre_lwjgl3glfw_341:clean :jre_lwjgl3glfw:jar :jre_lwjgl3glfw_341:jar --stacktrace --no-daemon

      - name: Build Debug APK
        run: ./gradlew :ZalithLauncher:assembleDebug --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      # Actions artifacts are always downloaded as ZIP files. Publish the APK
      # as a release asset instead so users can download/install the .apk directly.
      - name: Publish Debug APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/Official'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find ZalithLauncher/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$apk"
          cp "$apk" FlintLauncher-debug.apk
          if gh release view latest-debug >/dev/null 2>&1; then
            gh release delete latest-debug --cleanup-tag --yes
          fi
          gh release create latest-debug FlintLauncher-debug.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FlintLauncher latest debug APK" \
            --notes "Rolling debug APK from the Official branch. Replaced by each successful Official build."
