name: Build FlintLauncher APK

on:
  push:
    branches: [ Official, master, dev ]
  pull_request:
    branches: [ Official, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK type to build
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug
      architecture:
        description: APK architecture (all creates a universal APK)
        required: true
        type: choice
        options:
          - all
          - arm
          - arm64
          - x86
          - x86_64
        default: all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: flintlauncher-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager "ndk;25.2.9519653"
          yes | sdkmanager "cmake;3.22.1"

      - name: Grant Gradle Execute Permission
        run: chmod +x gradlew

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      - name: Build LWJGL 3.3.3 / 3.4.1 components
        run: ./gradlew :jre_lwjgl3glfw:clean :jre_lwjgl3glfw_341:clean :jre_lwjgl3glfw:jar :jre_lwjgl3glfw_341:jar --stacktrace --no-daemon

      - name: Build Debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        run: ./gradlew :FlintLauncher:assembleDebug -Darch=${{ inputs.architecture || 'all' }} --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
          FL_BUILD_TYPE: DEBUG
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Restore release signing key
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        env:
          FLINT_RELEASE_KEYSTORE_BASE64: ${{ secrets.FLINT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$FLINT_RELEASE_KEYSTORE_BASE64" || { echo "Missing FLINT_RELEASE_KEYSTORE_BASE64 repository secret"; exit 1; }
          printf '%s' "$FLINT_RELEASE_KEYSTORE_BASE64" | base64 --decode > FlintLauncher/flint-release.jks
          chmod 600 FlintLauncher/flint-release.jks

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        run: ./gradlew :FlintLauncher:assembleRelease -Darch=${{ inputs.architecture || 'all' }} --stacktrace --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m"
          FL_BUILD_TYPE: RELEASE
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          FLINT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.FLINT_RELEASE_KEYSTORE_PASSWORD }}

      - name: Remove temporary release signing key
        if: always()
        run: rm -f FlintLauncher/flint-release.jks

      # This is a debug build for testing, not a product release. GitHub Actions
      # stores workflow artifacts as ZIPs; the APK is inside and can be installed
      # after extracting it.
      - name: Upload DEBUG APK for testing
        if: github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: FlintLauncher-DEBUG-APK-${{ github.run_number }}
          path: FlintLauncher/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: FlintLauncher-RELEASE-APK-${{ github.run_number }}
          path: FlintLauncher/build/outputs/apk/release/*.apk
          retention-days: 14
